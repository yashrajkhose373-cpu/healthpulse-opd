<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{app.title}">Smart Hospital Queue System</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <!-- Header / Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark gov-navbar sticky-top">
        <div class="container-fluid px-4">
            <a class="navbar-brand d-flex align-items-center fw-bold fs-4" th:href="@{/}">
                <i class="bi bi-hospital-fill text-warning me-2 fs-3"></i>
                <span th:text="#{app.hospital_name}">District Hospital</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navContent">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link text-white fw-semibold" th:href="@{/}">
                            <i class="bi bi-house-door me-1"></i> <span th:text="#{nav.home}">Home</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-warning fw-bold" href="http://localhost:5173/" target="_blank">
                            <i class="bi bi-tv me-1"></i> <span th:text="#{nav.live_display}">Live Display</span>
                        </a>
                    </li>
                    <li class="nav-item" sec:authorize="hasRole('RECEPTION') or hasRole('ADMIN')">
                        <a class="nav-link text-white" th:href="@{/reception/dashboard}">
                            <i class="bi bi-person-badge me-1"></i> <span th:text="#{nav.reception_portal}">Reception</span>
                        </a>
                    </li>
                    <li class="nav-item" sec:authorize="hasRole('DOCTOR')">
                        <a class="nav-link text-white" th:href="@{/doctor/dashboard}">
                            <i class="bi bi-heart-pulse me-1"></i> <span th:text="#{nav.doctor_portal}">Doctor Portal</span>
                        </a>
                    </li>
                    <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                        <a class="nav-link text-white" th:href="@{/admin/dashboard}">
                            <i class="bi bi-shield-lock me-1"></i> <span th:text="#{nav.admin_portal}">Admin</span>
                        </a>
                    </li>
                    <li class="nav-item" sec:authorize="hasRole('PATIENT')">
                        <a class="nav-link text-white" th:href="@{/patient/dashboard}">
                            <i class="bi bi-person me-1"></i> <span th:text="#{nav.patient_portal}">My Dashboard</span>
                        </a>
                    </li>
                </ul>

                <!-- Language Selector -->
                <div class="d-flex align-items-center me-3">
                    <div class="btn-group btn-group-sm">
                        <a th:href="@{?(lang=en)}" class="btn btn-outline-light">English</a>
                        <a th:href="@{?(lang=hi)}" class="btn btn-outline-light">हिंदी</a>
                        <a th:href="@{?(lang=mr)}" class="btn btn-outline-light">मराठी</a>
                    </div>
                </div>

                <!-- Auth Buttons -->
                <div class="d-flex align-items-center">
                    <div sec:authorize="!isAuthenticated()">
                        <a th:href="@{/login}" class="btn btn-outline-light btn-sm me-2">
                            <i class="bi bi-box-arrow-in-right"></i> <span th:text="#{nav.login}">Login</span>
                        </a>
                        <a th:href="@{/register}" class="btn btn-warning btn-sm fw-bold">
                            <i class="bi bi-person-plus"></i> <span th:text="#{nav.register}">Register</span>
                        </a>
                    </div>
                    <div sec:authorize="isAuthenticated()" class="d-flex align-items-center">
                        <span class="text-light me-3 small">
                            <i class="bi bi-person-circle"></i> <span sec:authentication="name">User</span>
                        </span>
                        <a th:href="@{/logout}" class="btn btn-outline-danger btn-sm text-white border-white">
                            <i class="bi bi-box-arrow-right"></i> <span th:text="#{nav.logout}">Logout</span>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Container Content Slot -->
    <main class="flex-grow-1">
        <!-- Replaced by child template contents -->
    </main>

    <!-- Footer -->
    <footer class="bg-dark text-white text-center py-3 mt-auto">
        <div class="container">
            <small>&copy; 2026 Government Hospital Queue Management System | Built with Spring Boot 3 & WebSocket</small>
        </div>
    </footer>

    <!-- Bootstrap 5 JS & SockJS / STOMP -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1.5.1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
    <script th:src="@{/js/queue-websocket.js}"></script>
</body>
</html>
