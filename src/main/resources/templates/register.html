<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Patient Registration - Smart Hospital</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light d-flex align-items-center justify-content-center py-5">

    <div class="container" style="max-width: 480px;">
        <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
            <div class="p-4 text-center text-white" style="background: linear-gradient(135deg, #0a3d62, #1e3799);">
                <i class="bi bi-person-plus-fill display-5 text-warning"></i>
                <h4 class="fw-bold mt-2 mb-0">Patient Registration</h4>
                <p class="small text-light mb-0">Online Token & History Access</p>
            </div>
            
            <div class="card-body p-4">
                <form th:action="@{/register}" method="post">
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Full Name</label>
                        <input type="text" name="name" class="form-control" placeholder="e.g. Ramesh Kulkarni" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-bold">Mobile Number (For SMS Alerts)</label>
                        <input type="tel" name="phone" class="form-control" placeholder="e.g. 9822011223" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-bold">Email Address</label>
                        <input type="email" name="email" class="form-control" placeholder="e.g. patient@gmail.com" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-bold">Password</label>
                        <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                    </div>

                    <button type="submit" class="btn btn-warning w-100 py-2 fw-bold text-dark shadow-sm">
                        <i class="bi bi-check-circle"></i> Complete Registration
                    </button>
                </form>

                <div class="text-center mt-3 small">
                    <span>Already have an account? </span>
                    <a th:href="@{/login}" class="fw-bold text-decoration-none">Sign In</a>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
