<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login - Smart Hospital Queue System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="min-height: 100vh;">

    <div class="container" style="max-width: 440px;">
        <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
            <div class="p-4 text-center text-white" style="background: linear-gradient(135deg, #0a3d62, #1e3799);">
                <i class="bi bi-hospital-fill display-4 text-warning"></i>
                <h4 class="fw-bold mt-2 mb-0" th:text="#{app.hospital_name}">District Hospital</h4>
                <p class="small text-light mb-0">Role-Based Queue Access Portal</p>
            </div>
            
            <div class="card-body p-4">
                <div th:if="${errorMessage}" class="alert alert-danger py-2 small" th:text="${errorMessage}"></div>
                <div th:if="${logoutMessage}" class="alert alert-success py-2 small" th:text="${logoutMessage}"></div>
                <div th:if="${successMessage}" class="alert alert-success py-2 small" th:text="${successMessage}"></div>

                <form th:action="@{/login}" method="post">
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                            <input type="email" name="username" class="form-control" placeholder="doctor@hospital.gov.in" required autofocus>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-bold">Password</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-lock"></i></span>
                            <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2 fw-bold shadow-sm" style="background-color: #0a3d62;">
                        <i class="bi bi-box-arrow-in-right"></i> Sign In
                    </button>
                </form>

                <div class="text-center mt-3 small">
                    <span>New patient? </span>
                    <a th:href="@{/register}" class="fw-bold text-decoration-none">Create Account</a>
                </div>

                <hr class="my-3">
                <div class="text-center">
                    <a th:href="@{/display}" class="btn btn-sm btn-outline-secondary w-100">
                        <i class="bi bi-tv"></i> Open Live Waiting Queue Board
                    </a>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
